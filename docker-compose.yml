services:
  mongo:
    image: mongo:7
    container_name: mural-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: mural-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: mural_multispectral
      JWT_SECRET: change-this-to-a-long-random-secret-please
      DATA_DIR: /data
    ports:
      - "8011:8011"
    volumes:
      - mural-data:/data

volumes:
  mongo-data:
  mural-data:
